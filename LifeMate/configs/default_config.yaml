project:
  name: "LifeMate-POMDP"
  version: "1.0.0"
  seed: 42
  deterministic: true

hardware_constraints:
  max_total_params_b: 6.0
  max_llm_params_b: 5.0
  max_context_tokens: 16384
  safe_prompt_tokens: 12288
  max_sample_time_sec: 28.0
  offline_mode: true

asr:
  enabled: true
  use_oracle_transcript_if_available: false
  model_name_or_path: "models/phowhisper-small"
  estimated_params_b: 0.24
  sample_rate: 16000
  language: "vi"
  beam_size: 1
  temperature: 0.0
  apply_code_switching_lexicon: true
  lexicon_path: "configs/lexicon/code_switching_vi_en.yaml"

nlu:
  enable_unicode_nfc: true
  enable_time_normalizer: true
  enable_number_normalizer: true
  enable_profile_grounding: true
  default_timezone: "Asia/Ho_Chi_Minh"

schema_pruning:
  enable_dynamic_pruning: true
  retain_meta_tools: true
  retain_xref_provider_read_tools: true
  compact_descriptions: true

retrieval:
  enable_rag: true
  index_path: "artifacts/rag_trajectories.json"
  top_k: 2
  bm25_weight: 0.55
  app_overlap_weight: 0.45
  min_similarity_threshold: 0.15

pomdp_planner:
  llm_model_name_or_path: "models/Qwen2.5-3B-Instruct"
  lora_adapter_path: "artifacts/lora_adapter"
  estimated_params_b: 3.09
  backend: "heuristic_or_hf"
  temperature: 0.0
  do_sample: false
  max_new_tokens: 384
  enable_constrained_decoding: true
  system_prompt_path: "configs/prompts/policy_system_prompt.txt"
  policy_prompt_path: "configs/prompts/pomdp_policy_prompt.txt"
  info_gain_read_bonus: 0.35
  missing_param_ask_threshold: 0.70

execution:
  max_steps: 6
  max_self_correction_retries: 2
  enable_validate_guard: true
  enable_xref_guard: true
  prevent_duplicate_calls: true
  enforce_read_before_write_xref: true

training:
  sft_output_path: "artifacts/sft_pomdp_dataset.jsonl"
  val_split_ratio: 0.1
  lora_r: 16
  lora_alpha: 32
  lora_dropout: 0.05
  learning_rate: 2.0e-4
  num_train_epochs: 3
  per_device_train_batch_size: 2
  gradient_accumulation_steps: 8
  max_seq_length: 4096