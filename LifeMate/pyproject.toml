[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lifemate-pomdp-agent"
version = "1.0.0"
description = "Resource-Constrained State-Grounded POMDP Voice Agent for Zalo AI Challenge 2026"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [
    {name = "LifeMate Research Team"}
]
dependencies = [
    "pyyaml>=6.0.1",
    "numpy>=1.24.0",
    "rank-bm25>=0.2.2",
    "tqdm>=4.66.0",
]

[project.optional-dependencies]
ml = [
    "torch>=2.1.0",
    "torchaudio>=2.1.0",
    "transformers>=4.40.0",
    "accelerate>=0.29.0",
    "peft>=0.10.0",
    "bitsandbytes>=0.43.0",
    "datasets>=2.18.0",
    "soundfile>=0.12.1",
    "librosa>=0.10.1",
]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.3.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-v --tb=short"

[tool.ruff]
line-length = 100
target-version = "py310"