[project]
name = "lifemate_pomdp_framework"
version = "2.0.0"
description = "State-Grounded POMDP & 3-Stage Closed-Loop Research Framework for Spoken Vietnamese Tool-Using Agents"
authors = [{name = "Vang Thanh Huy"}]
requires-python = ">=3.10"
dependencies = [
    "torch>=2.1.0",
    "transformers>=4.40.0",
    "peft>=0.10.0",
    "trl>=0.8.0",
    "datasets>=2.18.0",
    "accelerate>=0.29.0",
    "rank_bm25>=0.2.2",
    "librosa>=0.10.1",
    "soundfile>=0.12.1",
    "pyyaml>=6.0.1",
    "pydantic>=2.7.0",
    "tqdm>=4.66.0"
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
